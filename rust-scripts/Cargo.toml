[package]
name = "rust-scripts"
version = "0.1.0"
edition = "2024"

[dependencies]
xshell = "0.2"
anyhow = "1.0"
itertools = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
roxmltree = "0.21"
base64 = "0.22"
hyper = { version = "0.14", features = ["client", "http1", "tcp"] }
hyper-openssl = "0.9"
openssl = "0.10"
webdriverbidi = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nom = "8"
url = "2"
rust-ini = "0.21"
